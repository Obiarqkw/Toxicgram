<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toxicgram Admin</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script></head><body><header><span class="brand">T</span><div><h1>Toxicgram Admin</h1><small>Управление каталогом • Toxic Stars</small></div></header><main><section id="login"><h2>Вход администратора</h2><p>Введите секретный ключ TOXICGRAM_ADMIN_KEY из Railway. Ключ не сохраняется в браузере.</p><form id="login-form"><input id="key" type="password" placeholder="Ключ администратора" required autocomplete="off"><button>Войти</button></form></section><div id="dashboard" hidden><div class="toolbar"><h2>Каталог подарков</h2><button id="logout">Выйти</button></div><div class="stats" id="stats"></div><section><div class="toolbar"><h2>Подарки</h2><button id="new">+ Добавить</button></div><div id="list"></div></section><section id="editor"><h2 id="edit-title">Новый подарок</h2><form id="gift-form"><div class="fields"><label>Идентификатор<input id="kind" required maxlength="24" pattern="[a-z0-9][a-z0-9-]{0,23}"></label><label>Название<input id="name" required maxlength="64"></label><label>Цена, ⭐<input id="price" type="number" min="1" max="100000000" required></label><label>Тираж (0 — без лимита)<input id="supply" type="number" min="0" max="100000000" value="0" required></label><label>Редкость<select id="rarity"><option value="common">Обычная</option><option value="rare">Редкая</option><option value="epic">Эпическая</option><option value="legendary">Легендарная</option></select></label><label>Эмодзи<input id="emoji" maxlength="16"></label></div><label class="check"><input id="upgrade" type="checkbox"> Разрешить улучшение (настройка для будущего клиента)</label><label class="check"><input id="active" type="checkbox" checked> Опубликован</label><label>Модель TGS или Lottie JSON (512 × 512)<input id="art" type="file" accept=".tgs,.json,application/json"></label><small id="art-state">Загрузите анимацию для нового подарка.</small><button type="submit">Сохранить подарок</button></form></section></div><p id="status" role="status"></p></main></body></html>
